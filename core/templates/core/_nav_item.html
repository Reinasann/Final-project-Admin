{% with is_active=active_tab|stringformat:"s" tab_name=tab|stringformat:"s" %}
<a href="{{ url }}"
   data-admin-nav-link data-admin-tab="{{ tab }}"
   data-active-style="background:var(--accent-soft);color:var(--accent);"
   data-inactive-style="{% if is_system_admin %}color:#4b5563;{% else %}color:#d1fae5;{% endif %}"
   {% if active_tab == tab %}aria-current="page"{% endif %}
   class="w-full flex items-center justify-between p-3 rounded-lg transition-colors mb-1 {% if active_tab == tab %}font-medium{% endif %}"
   style="{% if active_tab == tab %}background:var(--accent-soft);color:var(--accent);{% elif is_system_admin %}color:#4b5563;{% else %}color:#d1fae5;{% endif %}">
  <div class="flex items-center gap-3">
    <i data-lucide="{{ icon }}" class="w-5 h-5 shrink-0"></i>
    <span class="nav-label">{{ label }}</span>
  </div>
  {% if issue_badges %}
  <span class="nav-label flex items-center gap-1" data-issue-nav-badges>
    <span data-issue-badge="waiting" class="{% if not alert_waiting %}hidden {% endif %}min-w-5 rounded-full bg-red-500 px-1.5 py-0.5 text-center text-xs font-bold text-white" aria-label="รอรับเรื่อง {{ alert_waiting }} รายการ" title="รอรับเรื่อง">{{ alert_waiting }}</span>
    <span data-issue-badge="in-progress" class="{% if not alert_in_progress %}hidden {% endif %}min-w-5 rounded-full bg-yellow-400 px-1.5 py-0.5 text-center text-xs font-bold text-yellow-950" aria-label="รับเรื่องแล้ว {{ alert_in_progress }} รายการ" title="รับเรื่องแล้ว">{{ alert_in_progress }}</span>
  </span>
  {% elif alert %}
  <span class="nav-label rounded-full bg-red-500 px-2 py-0.5 text-xs text-white">{{ alert }}</span>
  {% endif %}
</a>
{% endwith %}
