{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RecycleAdmin - เข้าสู่ระบบ</title>
<link rel="stylesheet" href="{% static 'core/css/tailwind.css' %}"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');body{font-family:'Sarabun',sans-serif}.skeleton-pulse{animation:skeletonPulse 1.15s ease-in-out infinite alternate}@keyframes skeletonPulse{from{opacity:.52}to{opacity:1}}</style>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
<div id="login-page-skeleton" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 p-4 transition-opacity duration-200" role="status" aria-live="polite" aria-label="กำลังโหลดหน้าเข้าสู่ระบบ">
  <div class="skeleton-pulse w-full max-w-md rounded-2xl border border-gray-200 bg-white p-8 shadow-lg">
    <div class="mx-auto mb-5 h-16 w-16 rounded-2xl bg-gray-200"></div><div class="mx-auto mb-3 h-7 w-44 rounded bg-gray-200"></div><div class="mx-auto mb-8 h-4 w-64 max-w-full rounded bg-gray-200"></div>
    <div class="mb-5 h-12 rounded-xl bg-gray-200"></div><div class="mb-6 h-12 rounded-xl bg-gray-200"></div><div class="h-12 rounded-xl bg-gray-200"></div>
  </div>
</div>
<div id="login-progress" class="fixed inset-0 z-[60] hidden items-center justify-center bg-gray-100/90 p-6 backdrop-blur-sm" role="status" aria-live="polite">
  <div class="w-full max-w-sm rounded-2xl border border-gray-200 bg-white p-6 shadow-xl">
    <div class="mb-3 flex items-center justify-between gap-4"><span class="font-semibold text-gray-800">กำลังเข้าสู่ระบบ</span><span id="login-progress-value" class="text-sm font-bold text-blue-600">8%</span></div>
    <div class="h-2.5 overflow-hidden rounded-full bg-blue-100"><div id="login-progress-bar" class="h-full w-0 rounded-full bg-blue-600 transition-[width] duration-500 ease-out"></div></div>
    <p class="mt-3 text-sm text-gray-500">กำลังเตรียมข้อมูลหน้า Dashboard...</p>
  </div>
</div>
<div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-200">
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-3xl mx-auto mb-4">R</div>
    <h1 class="text-2xl font-bold text-gray-800">Recycle Admin</h1>
    <p class="text-gray-500">เข้าสู่ระบบสำหรับแอดมินสูงสุดหรือแอดมินหน่วยงาน</p>
  </div>
  <div id="login-error" class="{% if not error %}hidden {% endif %}mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm" role="alert">{{ error }}</div>
  <form id="login-form" method="post" class="space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">อีเมล</label>
      <div class="relative"><i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i><input type="email" name="email" required placeholder="admin@example.com" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"/></div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">รหัสผ่าน</label>
      <div class="relative"><i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i><input id="password" type="password" name="password" required placeholder="รหัสผ่าน" class="w-full pl-10 pr-12 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"/><button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500" aria-label="แสดงรหัสผ่าน"><i data-lucide="eye" class="w-5 h-5"></i></button></div>
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-md">เข้าสู่ระบบ</button>
  </form>
</div>
<script>
function toggleOrg(){document.getElementById('org-field')?.classList.toggle('hidden',document.getElementById('role')?.value==='System admin')}
function togglePassword(){const input=document.getElementById('password');input.type=input.type==='password'?'text':'password'}
function hideLoginSkeleton(){const skeleton=document.getElementById('login-page-skeleton');skeleton.classList.add('opacity-0');setTimeout(()=>skeleton.classList.add('hidden'),210)}
function setLoginProgress(percent){
  document.getElementById('login-progress-bar').style.width=`${percent}%`;
  document.getElementById('login-progress-value').textContent=`${percent}%`;
}
function showLoginProgress(){
  const progress=document.getElementById('login-progress');
  progress.classList.remove('hidden');progress.classList.add('flex');
  setLoginProgress(8);
  requestAnimationFrame(()=>setLoginProgress(82));
}
function hideLoginProgress(){
  const progress=document.getElementById('login-progress');
  progress.classList.add('hidden');progress.classList.remove('flex');
  setLoginProgress(0);
}
window.addEventListener('pageshow',()=>requestAnimationFrame(()=>{hideLoginSkeleton();hideLoginProgress()}));
document.getElementById('login-form').addEventListener('submit',async event=>{
  event.preventDefault();
  const form=event.currentTarget;
  const button=form.querySelector('button[type="submit"]');
  const errorBox=document.getElementById('login-error');
  if(button.disabled)return;
  button.disabled=true;errorBox.classList.add('hidden');showLoginProgress();
  let navigating=false;
  try{
    const response=await fetch(form.action||window.location.href,{
      method:'POST',body:new FormData(form),
      headers:{'X-Requested-With':'XMLHttpRequest','Accept':'text/html'},
    });
    const html=await response.text();
    const destination=new URL(response.url,window.location.href);
    if(response.ok&&destination.pathname==='/dashboard/'){
      navigating=true;setLoginProgress(100);
      window.setTimeout(()=>window.location.assign(destination.href),650);
      return;
    }
    const parsed=new DOMParser().parseFromString(html,'text/html');
    const message=parsed.getElementById('login-error')?.textContent.trim()||'ไม่สามารถเข้าสู่ระบบได้';
    errorBox.textContent=message;errorBox.classList.remove('hidden');
  }catch(error){
    errorBox.textContent='ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองอีกครั้ง';
    errorBox.classList.remove('hidden');
  }finally{
    if(!navigating){button.disabled=false;hideLoginProgress();}
  }
});
lucide.createIcons();
</script>
</body>
</html>
